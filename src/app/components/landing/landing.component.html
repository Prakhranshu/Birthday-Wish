<div class="landing-container" [@pageAnimation]>
  <!-- Animated background elements -->
  <div class="background-elements">
    <!-- Floating hearts -->
    <div class="floating-hearts">
      <div class="heart" *ngFor="let i of [].constructor(15); let idx = index" 
           [style.animation-delay]="idx * 0.5 + 's'">💖</div>
    </div>
    
    <!-- Magical sparkles -->
    <div class="magical-sparkles">
      <div class="sparkle" *ngFor="let i of [].constructor(25); let idx = index"
           [style.animation-delay]="idx * 0.3 + 's'">✨</div>
    </div>
    
    <!-- Floating bubbles -->
    <div class="floating-bubbles">
      <div class="bubble" *ngFor="let i of [].constructor(12); let idx = index"
           [style.animation-delay]="idx * 0.7 + 's'"></div>
    </div>
  </div>

  <!-- Confetti canvas -->
  <canvas id="confetti-canvas" class="confetti-canvas"></canvas>

  <!-- Main content -->
  <div class="content-wrapper">
    <!-- Header section with animated title -->
    <div class="header-section">
      <div class="title-container">
        <h1 class="main-title" [@titleAnimation]>
          <span class="title-line">{{ displayedText }}</span>
          <div class="typing-cursor" [class.blink]="currentIndex >= fullText.length">|</div>
        </h1>
        
        <!-- Decorative elements around title -->
        <div class="title-decorations">
          <div class="decoration left">🌟</div>
          <div class="decoration right">🌟</div>
        </div>
      </div>

      <!-- Birthday message with beautiful styling -->
      <div class="message-container" [@messageAnimation]>
        <div class="message-card">
          <div class="message-icon">🎂</div>
          <p class="birthday-message">{{ message }}</p>
          <div class="message-hearts">
            <span class="heart-1">💝</span>
            <span class="heart-2">💖</span>
            <span class="heart-3">💕</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Interactive journey button -->
    <div class="journey-section" [@buttonAnimation]>
      <div class="button-container">
        <button (click)="startJourney()" class="journey-btn" 
                (mouseenter)="onButtonHover()" (mouseleave)="onButtonLeave()">
          <div class="btn-background"></div>
          <div class="btn-content">
            <span class="btn-icon">🚀</span>
            <span class="btn-text">Start the Journey</span>
            <div class="btn-sparkles">
              <span class="sparkle-btn">✨</span>
              <span class="sparkle-btn">⭐</span>
              <span class="sparkle-btn">💫</span>
            </div>
          </div>
          <div class="btn-glow"></div>
        </button>
        
        <!-- Encouraging text -->
        <p class="journey-hint">Ready to explore our beautiful memories together?</p>
      </div>
    </div>
  </div>

  <!-- Bottom decorative section -->
  <div class="bottom-decoration">
    <div class="wave-pattern">
      <svg viewBox="0 0 1200 120" preserveAspectRatio="none">
        <path d="M0,0V46.29c47.79,22.2,103.59,32.17,158,28,70.36-5.37,136.33-33.31,206.8-37.5C438.64,32.43,512.34,53.67,583,72.05c69.27,18,138.3,24.88,209.4,13.08,36.15-6,69.85-17.84,104.45-29.34C989.49,25,1113-14.29,1200,52.47V0Z" opacity=".25" class="shape-fill"></path>
        <path d="M0,0V15.81C13,36.92,27.64,56.86,47.69,72.05,99.41,111.27,165,111,224.58,91.58c31.15-10.15,60.09-26.07,89.67-39.8,40.92-19,84.73-46,130.83-49.67,36.26-2.85,70.9,9.42,98.6,31.56,31.77,25.39,62.32,62,103.63,73,40.44,10.79,81.35-6.69,119.13-24.28s75.16-39,116.92-43.05c59.73-5.85,113.28,22.88,168.9,38.84,30.2,8.66,59,6.17,87.09-7.5,22.43-10.89,48-26.93,60.65-49.24V0Z" opacity=".5" class="shape-fill"></path>
        <path d="M0,0V5.63C149.93,59,314.09,71.32,475.83,42.57c43-7.64,84.23-20.12,127.61-26.46,59-8.63,112.48,12.24,165.56,35.4C827.93,77.22,886,95.24,951.2,90c86.53-7,172.46-45.71,248.8-84.81V0Z" class="shape-fill"></path>
      </svg>
    </div>
  </div>

  <!-- Loading overlay for smooth transitions -->
  <div class="loading-overlay" [class.hidden]="!isLoading" [@loadingAnimation]>
    <div class="loading-content">
      <div class="loading-spinner"></div>
      <p>Preparing your magical journey...</p>
    </div>
  </div>
</div>
